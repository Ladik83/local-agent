<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Аквариум</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05121c; font-family: system-ui, Arial, sans-serif; }
  #app { position: fixed; inset: 0; }
  #ui {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    color: #d6f2ff; user-select: none;
  }
  #hint {
    background: rgba(8,26,38,0.55); backdrop-filter: blur(6px);
    padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5;
    border: 1px solid rgba(120,200,255,0.25); max-width: 260px;
  }
  #controls { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: rgba(14,42,60,0.7); color: #d6f2ff; border: 1px solid rgba(120,200,255,0.35);
    padding: 8px 14px; border-radius: 9px; font-size: 13px; cursor: pointer; transition: .15s;
  }
  .btn:hover { background: rgba(30,74,105,0.85); }
  #fps {
    position: fixed; top: 14px; right: 14px; z-index: 10; color: #9fe6b0;
    background: rgba(8,26,38,0.55); padding: 6px 10px; border-radius: 8px; font-size: 12px;
    font-family: monospace;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="hint">🐠 3D-аквариум<br>мышь — вращать<br>колесо — приблизить</div>
  <div id="controls">
    <button class="btn" id="pauseBtn">⏸ Пауза</button>
    <button class="btn" id="lightBtn">💡 Свет: вкл</button>
  </div>
</div>
<div id="fps">-- fps</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================ БАЗА ============================
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071c2a);
scene.fog = new THREE.FogExp2(0x0c3a52, 0.018);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);

// Границы аквариума (внутренние)
const TANK = { x: 6, z: 4, bottom: -3.5, top: 3.5, water: 2.6 };

// ============================ СВЕТ ============================
const ambient = new THREE.AmbientLight(0x7fd0ff, 0.55);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xcdeeff, 0x0a2030, 0.5);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
keyLight.position.set(6, 14, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 60;
keyLight.shadow.camera.left = -12;
keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -12;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const backLight = new THREE.PointLight(0x66ddff, 12, 40, 2);
backLight.position.set(-4, 1, -6);
scene.add(backLight);

const pumpLight = new THREE.PointLight(0xaef0ff, 4, 14, 2);
pumpLight.position.set(-4.5, -2, 3);
scene.add(pumpLight);

// ============================ МАТЕРИАЛЫ ============================
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xdff4ff, transmission: 1.0, opacity: 1, transparent: true,
  ior: 1.33, thickness: 0.4, roughness: 0.06, metalness: 0,
  side: THREE.DoubleSide, depthWrite: false
});

const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x3fb8e6, transmission: 0.85, opacity: 0.9, transparent: true,
  ior: 1.33, roughness: 0.12, metalness: 0, side: THREE.DoubleSide, depthWrite: false
});

const gravelMat = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0.05 });

const floorGlassMat = new THREE.MeshPhysicalMaterial({
  color: 0xeaf7ff, transmission: 0.9, opacity: 1, transparent: true, ior: 1.33,
  thickness: 0.4, roughness: 0.1, side: THREE.DoubleSide, depthWrite: false
});

// ============================ ДНО (стекло) + Гравий ============================
const floor = new THREE.Mesh(new THREE.PlaneGeometry(TANK.x * 2, TANK.z * 2), floorGlassMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = TANK.bottom;
floor.receiveShadow = true;
scene.add(floor);

const gravelGeo = new THREE.SphereGeometry(0.13, 6, 5);
const GRAVEL_N = 520;
const gravel = new THREE.InstancedMesh(gravelGeo, gravelMat, GRAVEL_N);
gravel.receiveShadow = true;
const _d = new THREE.Object3D();
const pal = [0x8d6e3a, 0xa0824d, 0x6b5638, 0xb09860, 0x7a6650, 0x9c8a5e, 0x5f4d35];
for (let i = 0; i < GRAVEL_N; i++) {
  _d.position.set(
    (Math.random() - 0.5) * (TANK.x * 2 - 0.4),
    TANK.bottom + 0.06 + Math.random() * 0.22,
    (Math.random() - 0.5) * (TANK.z * 2 - 0.4)
  );
  const s = 0.6 + Math.random() * 1.2;
  _d.scale.set(s, s * (0.6 + Math.random() * 0.5), s);
  _d.updateMatrix();
  gravel.setMatrixAt(i, _d.matrix);
  gravel.setColorAt(i, new THREE.Color(pal[(Math.random() * pal.length) | 0]));
}
gravel.instanceMatrix.needsUpdate = true;
gravel.instanceColor.needsUpdate = true;
scene.add(gravel);

// ============================ КАУСТИКИ (шейдер на дне) ============================
const causticsMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);} `,
  fragmentShader: `
    uniform float uTime; varying vec2 vUv;
    void main(){
      vec2 p = vUv * vec2(10.0, 6.67);
      float c = 0.0;
      c += sin(p.x*1.5 + uTime*0.9) * cos(p.y*1.5 + uTime*0.7);
      c += sin((p.x + p.y)*2.3 - uTime*1.1) * 0.6;
      c += sin(sqrt((p.x-4.0)*(p.x-4.0)+(p.y-3.0)*(p.y-3.0))*2.0 + uTime)*0.5;
      c = c*0.25 + 0.5;
      c = pow(clamp(c,0.0,1.0), 3.0);
      vec3 col = vec3(0.45,0.85,1.0);
      gl_FragColor = vec4(col, c*0.55);
    }`
});
const caustics = new THREE.Mesh(new THREE.PlaneGeometry(TANK.x * 2, TANK.z * 2), causticsMat);
caustics.rotation.x = -Math.PI / 2;
caustics.position.y = TANK.bottom + 0.05;
scene.add(caustics);

// ============================ СТЕКЛЯННЫЕ СТЕНЫ ============================
function wall(w, h, pos, rotY) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glassMat);
  m.position.copy(pos); m.rotation.y = rotY;
  m.material = glassMat.clone();
  scene.add(m);
}
const wallH = TANK.top - TANK.bottom;
wall(TANK.x * 2, wallH, new THREE.Vector3(0, (TANK.bottom + TANK.top) / 2, TANK.z), Math.PI);
wall(TANK.x * 2, wallH, new THREE.Vector3(0, (TANK.bottom + TANK.top) / 2, -TANK.z), 0);
wall(TANK.z * 2, wallH, new THREE.Vector3(TANK.x, (TANK.bottom + TANK.top) / 2, 0), Math.PI / 2);
wall(TANK.z * 2, wallH, new THREE.Vector3(-TANK.x, (TANK.bottom + TANK.top) / 2, 0), -Math.PI / 2);

// ============================ ВОДНАЯ ПОВЕРХНОСТЬ ============================
const waterGeo = new THREE.PlaneGeometry(TANK.x * 2, TANK.z * 2, 32, 22);
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;
water.position.y = TANK.water;
scene.add(water);

// ============================ ЗАМОК + КАМЕНЬ ============================
const castle = new THREE.Group();
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8a8578, roughness: 1 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x7a3b3b, roughness: 0.8 });
const winMat = new THREE.MeshStandardMaterial({ color: 0xffd27a, emissive: 0xffb04a, emissiveIntensity: 0.8 });
const doorMat = new THREE.MeshStandardMaterial({ color: 0x4a3221, roughness: 0.9 });

// Камень-основание
const baseRock = new THREE.Mesh(new THREE.DodecahedronGeometry(2.4, 0), stoneMat);
baseRock.scale.set(1.4, 0.5, 1.6);
baseRock.position.set(0, TANK.bottom + 1.0, -2.6);
baseRock.castShadow = true; baseRock.receiveShadow = true;
castle.add(baseRock);

function tower(x, z, h, r) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 10), stoneMat);
  shaft.position.y = TANK.bottom + h / 2;
  shaft.castShadow = true; shaft.receiveShadow = true;
  g.add(shaft);
  // крыша-конус
  const roof = new THREE.Mesh(new THREE.ConeGeometry(r * 1.5, r * 2.2, 10), roofMat);
  roof.position.y = TANK.bottom + h + r;
  roof.castShadow = true;
  g.add(roof);
  // зубцы
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.28, 0.22), stoneMat);
    b.position.set(Math.cos(a) * (r + 0.1), TANK.bottom + h, Math.sin(a) * (r + 0.1));
    b.castShadow = true;
    g.add(b);
  }
  g.position.x = x; g.position.z = z;
  return g;
}
castle.add(tower(-2.4, -2.8, 3.4, 0.55));
castle.add(tower(2.4, -2.8, 3.4, 0.55));
castle.add(tower(0, -3.6, 4.4, 0.7));

// Стена с аркой-воротами
const wallBack = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 0.5), stoneMat);
wallBack.position.set(0, TANK.bottom + 1.5, -3.2);
wallBack.castShadow = true; wallBack.receiveShadow = true;
castle.add(wallBack);

// Ворота-арка
const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.2), doorMat);
doorFrame.position.set(0, TANK.bottom + 0.9, -3.0);
castle.add(doorFrame);
const arch = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.12, 8, 12, Math.PI), doorMat);
arch.position.set(0, TANK.bottom + 1.8, -3.0);
arch.rotation.z = Math.PI;
castle.add(arch);

// Окна
for (const x of [-1.6, 1.6]) {
  const w = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.15), winMat);
  w.position.set(x, TANK.bottom + 2.2, -2.95);
  castle.add(w);
}
scene.add(castle);

// ============================ ВОДОРОСЛИ ============================
const weeds = [];
function makeSeaweed(x, z, hue, height) {
  const g = new THREE.Group();
  const col = new THREE.Color().setHSL(hue, 0.6, 0.35);
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7, side: THREE.DoubleSide });
  const segs = 6;
  let baseY = TANK.bottom + 0.1;
  for (let i = 0; i < segs; i++) {
    const t = i / segs;
    const r0 = 0.22 - t * 0.16;
    const h = height / segs;
    const seg = new THREE.Mesh(new THREE.ConeGeometry(Math.max(r0, 0.05), h, 7, 1, true), mat);
    seg.position.y = baseY + h / 2 + i * (height / segs) * 0.85;
    seg.castShadow = true;
    g.add(seg);
  }
  g.position.set(x, 0, z);
  g.userData = {
    phase: Math.random() * Math.PI * 2,
    amp: 0.12 + Math.random() * 0.18,
    spd: 0.6 + Math.random() * 0.5
  };
  weeds.push(g);
  scene.add(g);
}
for (let i = 0; i < 10; i++) {
  const x = (Math.random() - 0.5) * (TANK.x * 2 - 1.5);
  const z = (Math.random() - 0.5) * (TANK.z * 2 - 1.5);
  makeSeaweed(x, z, 0.28 + Math.random() * 0.08, 1.4 + Math.random() * 1.4);
}

// ============================ ДЕКОР: камни, раушки, сундук ============================
const decor = new THREE.Group();
const rockMat2 = new THREE.MeshStandardMaterial({ color: 0x6f6a5f, roughness: 1 });
for (let i = 0; i < 7; i++) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.4, 0), rockMat2);
  r.position.set((Math.random() - 0.5) * (TANK.x * 2 - 1), TANK.bottom + 0.2, (Math.random() - 0.5) * (TANK.z * 2 - 1));
  r.rotation.set(Math.random(), Math.random(), Math.random());
  r.scale.y = 0.7;
  r.castShadow = true; r.receiveShadow = true;
  decor.add(r);
}
const shellMat = new THREE.MeshStandardMaterial({ color: 0xf3d9c0, roughness: 0.6, side: THREE.DoubleSide });
for (let i = 0; i < 4; i++) {
  const shell = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.4, 10), shellMat);
  cone.rotation.x = Math.PI / 2.2;
  shell.add(cone);
  shell.position.set((Math.random() - 0.5) * (TANK.x * 2 - 1), TANK.bottom + 0.15, (Math.random() - 0.5) * (TANK.z * 2 - 1));
  shell.rotation.y = Math.random() * Math.PI;
  decor.add(shell);
}
// Сундук
const chest = new THREE.Group();
const chestMat = new THREE.MeshStandardMaterial({ color: 0x7a4a24, roughness: 0.8 });
const bandMat = new THREE.MeshStandardMaterial({ color: 0x8a6a2a, roughness: 0.5, metalness: 0.6 });
const chestBox = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 0.7), chestMat);
chestBox.position.y = 0.3; chestBox.castShadow = true; chestBox.receiveShadow = true;
chest.add(chestBox);
const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.02, 12, 1, false, 0, Math.PI), chestMat);
lid.rotation.z = Math.PI / 2; lid.rotation.y = Math.PI / 2; lid.position.y = 0.6; lid.scale.z = 0.55;
lid.castShadow = true;
chest.add(lid);
const b1 = new THREE.Mesh(new THREE.BoxGeometry(1.04, 0.12, 0.74), bandMat); b1.position.y = 0.3; chest.add(b1);
chest.position.set(3.2, TANK.bottom, 1.6);
chest.castShadow = true;
decor.add(chest);
scene.add(decor);

// ============================ ПОМПА С ВОЗДУХОМ ============================
const pump = new THREE.Group();
const tubeMat = new THREE.MeshStandardMaterial({ color: 0x33383f, roughness: 0.5, metalness: 0.4 });
const pumpBody = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 1.0, 12), tubeMat);
pumpBody.position.set(-4.6, TANK.bottom + 0.6, 3.2);
pumpBody.castShadow = true;
pump.add(pumpBody);
const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.2, 8), tubeMat);
tube.position.set(-4.6, TANK.bottom + 1.8, 3.2);
tube.rotation.z = 0.15;
pump.add(tube);
// Распылитель у дна
const diffuser = new THREE.Group();
const diff = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.4, 10), new THREE.MeshStandardMaterial({ color: 0x555b64, roughness: 0.4, metalness: 0.5 }));
diffuser.add(diff);
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2;
  const hole = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), tubeMat);
  hole.position.set(Math.cos(a) * 0.14, 0.15, Math.sin(a) * 0.14);
  diffuser.add(hole);
}
diffuser.position.set(-4.6, TANK.bottom + 0.2, 3.2);
pump.add(diffuser);
scene.add(pump);
const diffPos = new THREE.Vector3(-4.6, TANK.bottom + 0.42, 3.2);

// Пузырьки от помпы (InstancedMesh)
const BUBBLE_N = 70;
const bubbleGeo = new THREE.SphereGeometry(0.06, 8, 6);
const bubbleMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, opacity: 0.7, transparent: true, roughness: 0.1, depthWrite: false });
const bubbles = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLE_N);
bubbles.frustumCulled = false;
const _bm = new THREE.Matrix4();
const _scl = new THREE.Vector3();
for (let i = 0; i < BUBBLE_N; i++) {
  _scl.setScalar(0); _bm.makeScale(_scl.x, _scl.y, _scl.z); bubbles.setMatrixAt(i, _bm);
}
scene.add(bubbles);

// ============================ ГУППИ ============================
function makeGuppy(variant, idx) {
  const g = new THREE.Group();
  const bodyCol = [0xff8c1a, 0x2e86de, 0xffd633, 0x6ab04c][(idx) % 4];
  const bodyMat = new THREE.MeshStandardMaterial({ color: bodyCol, roughness: 0.4 });
  const finMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(bodyCol).offsetHSL(0, 0, 0.18), roughness: 0.5, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 11), bodyMat);
  body.scale.set(0.5, 0.42, 1.05); // веретено, нос по -Z
  body.castShadow = true;
  g.add(body);

  // Голова
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 9), bodyMat);
  head.position.z = -0.45; head.scale.set(0.9, 0.85, 0.9);
  head.castShadow = true;
  g.add(head);

  // Хвост-веер (плоский конус) на.pivot у основания
  const tailPivot = new THREE.Group();
  tailPivot.position.set(0, 0, 0.32);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.55, 8, 1, false), finMat);
  tail.rotation.x = Math.PI / 2; // указывает в +Z
  tail.position.z = 0.42;
  tail.castShadow = true;
  tailPivot.add(tail);
  g.add(tailPivot);

  // Спинной плавник
  const dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.42, 5, 1, false), finMat);
  dorsal.position.set(0, 0.3, -0.02); dorsal.rotation.z = 0.15;
  dorsal.castShadow = true;
  g.add(dorsal);

  // Грудные плавники
  const finL = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.28, 5, 1, false), finMat);
  finL.position.set(-0.22, -0.12, -0.05); finL.rotation.z = 0.5; finL.rotation.y = -0.4;
  g.add(finL);
  const finR = finL.clone();
  finR.position.x = 0.22; finR.rotation.y = 0.4;
  g.add(finR);

  // Глаза
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.3 });
  for (const sx of [-0.13, 0.13]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), eyeMat);
    eye.position.set(sx, 0.08, -0.62);
    g.add(eye);
  }

  // Крапчатая версия — пятнышки
  if (variant === 3) {
    const spotMat = new THREE.MeshStandardMaterial({ color: 0x2b5a2b, roughness: 0.5 });
    for (let i = 0; i < 9; i++) {
      const sp = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), spotMat);
      sp.position.set((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.7 - 0.1);
      g.add(sp);
    }
  }

  g.scale.setScalar(0.62);
  return g;
}

const fishList = [];
const FISH_N = 7;
for (let i = 0; i < FISH_N; i++) {
  const grp = makeGuppy(i % 4, i);
  scene.add(grp);
  fishList.push({
    grp, tail: grp.children.find(c => c.type === 'Group'), // хвост - добавим ниже надёжно
    finL: grp.children.find(c => c.position.x < -0.1 && c.position.x > -0.4 && c.position.y < 0),
    finR: grp.children.find(c => c.position.x > 0.1 && c.position.x < 0.4 && c.position.y < 0),
    A: [2.8 + Math.random() * 2, 0.25 + Math.random() * 0.2, 2.2 + Math.random() * 1.4, 1.4 + Math.random() * 1.2],
    P: [4 + Math.random() * 3, 3 + Math.random() * 2, 5 + Math.random() * 3, 3.5 + Math.random() * 2.5],
    ph: [Math.random() * 6, Math.random() * 6, Math.random() * 6, Math.random() * 6],
    baseY: (Math.random() - 0.5) * 1.6,
    speed: 0.7 + Math.random() * 0.8,
    prevY: 0
  });
}
// Точное получение хвоста (последний дочерний Group с конусом)
fishList.forEach(f => {
  f.tail = null;
  grpSearch: for (const c of f.grp.children) {
    if (c.type === 'Group') { f.tail = c; break grpSearch; }
  }
});

// ============================ КРАБ ============================
function makeCrab() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.6 });
  const legMat = new THREE.MeshStandardMaterial({ color: 0xa93226, roughness: 0.7 });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(0.5, 14, 10), bodyMat);
  shell.scale.set(1.0, 0.4, 1.3);
  shell.position.y = 0.2;
  shell.castShadow = true;
  g.add(shell);

  // Глаза на стебельках
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3 });
  const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.4 });
  const eyes = [];
  for (const sx of [-0.22, 0.22]) {
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.25, 6), bodyMat);
    stalk.position.set(sx, 0.45, -0.35);
    stalk.rotation.z = sx > 0 ? -0.3 : 0.3;
    g.add(stalk);
    const wb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), eyeWhite);
    wb.position.set(sx * 1.05, 0.6, -0.42);
    g.add(wb);
    const ep = new THREE.Mesh(new THREE.SphereGeometry(0.045, 7, 6), eyeMat);
    ep.position.set(sx * 1.05, 0.6, -0.48);
    g.add(ep);
    eyes.push(wb);
  }

  // Клешни
  const claws = [];
  for (const sx of [-0.4, 0.4]) {
    const claw = new THREE.Group();
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.35, 5, 8), legMat);
    arm.position.set(sx * 0.6, 0.22, -0.35);
    arm.rotation.x = 0.5;
    claw.add(arm);
    const pincer = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.3, 8), bodyMat);
    pincer.position.set(sx * 0.6, 0.35, -0.55);
    pincer.rotation.x = -Math.PI / 2.2;
    claw.add(pincer);
    g.add(claw);
    claws.push(claw);
  }

  // 8 ног из капсул
  const legs = [];
  for (let side = 0; side < 2; side++) {
    const sx = side === 0 ? -1 : 1;
    for (let i = 0; i < 4; i++) {
      const leg = new THREE.Group();
      const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.3, 4, 6), legMat);
      thigh.position.set(0, 0.1, 0);
      leg.add(thigh);
      const shin = new THREE.Group();
      shin.position.set(0, -0.25, 0);
      const shinMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.28, 4, 6), legMat);
      shinMesh.position.y = -0.14;
      shin.add(shinMesh);
      leg.add(shin);
      const bx = sx * 0.42;
      const bz = -0.2 + i * 0.2;
      leg.position.set(bx, 0.12, bz);
      leg.rotation.z = sx * 0.6;
      leg.userData.shin = shin;
      leg.userData.phase = (i % 2) * Math.PI;
      legs.push(leg);
      g.add(leg);
    }
  }

  g.userData = { bodyMat, legs, claws, eyes, t: 0, state: 'walk', timer: 2 + Math.random() * 3,
    dir: Math.random() * Math.PI * 2, walkProg: 0, speed: 0.6 };
  return g;
}
const crab = makeCrab();
crab.position.set(2.5, 0.05, 1.2);
scene.add(crab);

// ============================ УЛИТКИ ============================
function makeSnail(color) {
  const g = new THREE.Group();
  const shellMat = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.1 });
  const shell = new THREE.Mesh(new THREE.TorusKnotGeometry(0.28, 0.1, 80, 8, 2, 3), shellMat);
  shell.position.y = 0.3; shell.rotation.x = Math.PI / 2.4;
  shell.castShadow = true;
  g.add(shell);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb7c98f, roughness: 0.7 });
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 9), bodyMat);
  foot.scale.set(0.9, 0.4, 1.5);
  foot.position.set(0, 0.1, -0.15);
  foot.castShadow = true;
  g.add(foot);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), bodyMat);
  head.position.set(0, 0.14, -0.42);
  g.add(head);
  // Усики
  const antMat = new THREE.MeshStandardMaterial({ color: 0x9fb07d, roughness: 0.7 });
  const ants = [];
  for (const sx of [-0.06, 0.06]) {
    const a = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 0.2, 5), antMat);
    a.position.set(sx, 0.26, -0.45);
    a.rotation.z = sx > 0 ? -0.4 : 0.4;
    g.add(a);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 5), antMat);
    tip.position.set(sx * 0.7, 0.35, -0.52);
    g.add(tip);
    ants.push(a);
  }
  g.userData = { ants, dir: Math.random() * 6, turnTimer: 3 + Math.random() * 4, speed: 0.25 + Math.random() * 0.2, onWall: Math.random() > 0.5, face: Math.random() * 6 };
  return g;
}
const snails = [makeSnail(0xd94f4f), makeSnail(0x4fb0d9), makeSnail(0xe0c04f)];
snails.forEach(s => {
  s.position.set((Math.random() - 0.5) * (TANK.x * 2 - 1.5), TANK.bottom + 0.15, (Math.random() - 0.5) * (TANK.z * 2 - 1.5));
  scene.add(s);
});

// ============================ ДЕКОР-ПУЗЫРЬКИ (стоячие) ============================
const decoBulbMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.8, opacity: 0.6, transparent: true, roughness: 0.1, depthWrite: false });
const decoBubbles = new THREE.Group();
for (let i = 0; i < 14; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.05 + Math.random() * 0.06, 8, 6), decoBulbMat);
  b.position.set((Math.random() - 0.5) * (TANK.x * 2 - 1), Math.random() * (TANK.water - TANK.bottom) + TANK.bottom + 0.5, (Math.random() - 0.5) * (TANK.z * 2 - 1));
  b.userData.baseY = b.position.y;
  b.userData.spd = 0.5 + Math.random();
  decoBubbles.add(b);
}
scene.add(decoBubbles);

// ============================ КАСТОЕ КОНТРОЛИ (вращение + зум) ============================
const orbit = { yaw: 0.6, pitch: 0.35, dist: 16, target: new THREE.Vector3(0, 0.3, -0.5), dragging: false, last: { x: 0, y: 0 } };
function updateCamera() {
  const cp = Math.cos(orbit.pitch), sp = Math.sin(orbit.pitch);
  const cy = Math.cos(orbit.yaw), sy = Math.sin(orbit.yaw);
  camera.position.set(
    orbit.target.x + orbit.dist * cp * sy,
    orbit.target.y + orbit.dist * sp,
    orbit.target.z + orbit.dist * cp * cy
  );
  camera.lookAt(orbit.target);
}
updateCamera();

const dom = renderer.domElement;
dom.addEventListener('pointerdown', e => { orbit.dragging = true; orbit.last.x = e.clientX; orbit.last.y = e.clientY; dom.setPointerCapture(e.pointerId); });
dom.addEventListener('pointermove', e => {
  if (!orbit.dragging) return;
  const dx = e.clientX - orbit.last.x;
  const dy = e.clientY - orbit.last.y;
  orbit.last.x = e.clientX; orbit.last.y = e.clientY;
  orbit.yaw += dx * 0.006;
  orbit.pitch += dy * 0.006;
  orbit.pitch = Math.max(-0.2, Math.min(1.35, orbit.pitch));
  updateCamera();
});
window.addEventListener('pointerup', () => { orbit.dragging = false; });
dom.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.dist += e.deltaY * 0.01;
  orbit.dist = Math.max(6, Math.min(30, orbit.dist));
  updateCamera();
}, { passive: false });

// ============================ ИНТЕРФЕЙС ============================
let paused = false;
const pauseBtn = document.getElementById('pauseBtn');
const lightBtn = document.getElementById('lightBtn');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ Продолжить' : '⏸ Пауза';
});
let lightOn = true;
lightBtn.addEventListener('click', () => {
  lightOn = !lightOn;
  lightBtn.textContent = lightOn ? '💡 Свет: вкл' : '💡 Свет: выкл';
});

// ============================ RESIZE ============================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================ АНИМАЦИЯ ============================
const clock = new THREE.Clock();
let elapsed = 0;
let fpsAccum = 0, fpsCount = 0, fpsTimer = 0;
const fpsEl = document.getElementById('fps');
const _m4 = new THREE.Matrix4();
const _v = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (paused) { renderer.render(scene, camera); return; }
  elapsed += dt;
  const t = elapsed;

  // Водная поверхность (рябь)
  {
    const pos = waterGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      pos.setZ(i, Math.sin(x * 1.3 + t * 1.6) * 0.05 + Math.cos(y * 1.5 + t * 1.3) * 0.05);
    }
    pos.needsUpdate = true;
    waterGeo.computeVertexNormals();
  }

  // Каустики
  causticsMat.uniforms.uTime.value = t;

  // Водоросли
  for (const w of weeds) {
    const u = w.userData;
    w.rotation.y = Math.sin(t * u.spd + u.phase) * 0.15;
    w.rotation.x = Math.cos(t * u.spd * 0.8 + u.phase) * u.amp;
  }

  // Пузырьки от помпы
  {
    const rise = 2.2;
    const range = TANK.water - (TANK.bottom + 0.5);
    for (let i = 0; i < BUBBLE_N; i++) {
      let p = ((t * rise / range) + i / BUBBLE_N) % 1; // 0..1 снизу вверх
      const y = (TANK.bottom + 0.5) + p * range;
      const wob = Math.sin(t * 4 + i) * 0.05;
      _v.set(diffPos.x + wob, y, diffPos.z + Math.cos(t * 3 + i) * 0.05);
      const fade = Math.min(p / 0.12, 1) * Math.min((1 - p) / 0.15, 1);
      const s = 0.5 + fade * 0.7;
      _m4.makeScale(s, s, s);
      _m4.translate(_v.x, _v.y, _v.z);
      bubbles.setMatrixAt(i, _m4);
    }
    bubbles.instanceMatrix.needsUpdate = true;
  }

  // Декор-пузырьки
  for (const b of decoBubbles.children) {
    b.position.y = b.userData.baseY + Math.sin(t * b.userData.spd) * 0.06;
  }

  // Рыбы
  for (const f of fishList) {
    const A = f.A, P = f.P, ph = f.ph;
    const x = A[0] * Math.sin(t / P[0] + ph[0]) + A[1] * Math.sin(t / P[1] + ph[1]);
    const z = A[2] * Math.sin(t / P[2] + ph[2]) + A[3] * Math.sin(t / P[3] + ph[3]);
    const y = f.baseY + Math.sin(t * 1.3 + f.ph[0]) * 0.25;
    // след. точка для ориентации
    const nx = A[0] * Math.sin((t + dt) / P[0] + ph[0]) + A[1] * Math.sin((t + dt) / P[1] + ph[1]);
    const nz = A[2] * Math.sin((t + dt) / P[2] + ph[2]) + A[3] * Math.sin((t + dt) / P[3] + ph[3]);
    const ny = y + Math.cos(t * 1.3 + f.ph[0]) * 0.25 * 1.3 * dt;
    _v.set(nx, ny, nz);
    f.grp.position.set(x, y, z);
    // плавный поворот носом по направлению
    const lookQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, -1), _v.clone().sub(f.grp.position).normalize());
    f.grp.quaternion.slerp(lookQ, 0.18);
    // покачивание тела
    f.grp.rotation.z = Math.sin(t * 2 + f.ph[1]) * 0.08;
    // виление хвостом (частота от скорости)
    const vel = Math.hypot(nx - x, ny - y, nz - z) / Math.max(dt, 0.0001);
    const wag = 0.5 + vel * 5;
    if (f.tail) f.tail.rotation.z = Math.sin(t * (wag * 6) + f.ph[2]) * 0.4;
    // плавание плавниками
    if (f.finL) f.finL.rotation.z = 0.5 + Math.sin(t * (3 + vel * 4)) * 0.5;
    if (f.finR) f.finR.rotation.z = -0.5 - Math.sin(t * (3 + vel * 4)) * 0.5;
    // лёгкая подстройка наклона хвоста
    if (f.tail) f.tail.rotation.x = Math.PI / 2 + Math.sin(t * (wag * 6) + f.ph[2]) * 0.15;
  }

  // Краб
  {
    const u = crab.userData;
    u.t += dt;
    u.timer -= dt;
    if (u.timer <= 0) { u.state = u.state === 'walk' ? 'pause' : 'walk'; u.timer = 2 + Math.random() * 3; }
    if (u.state === 'walk') {
      u.walkProg += u.speed * dt;
      crab.position.x += Math.sin(u.dir) * u.speed * dt;
      crab.position.z += Math.cos(u.dir) * u.speed * dt;
      crab.rotation.y = u.dir;
      // отскок у стёкол
      if (Math.abs(crab.position.x) > TANK.x - 0.8) { u.dir = Math.PI - u.dir + (Math.random() > 0.5 ? 0.4 : -0.4); }
      if (Math.abs(crab.position.z) > TANK.z - 0.8) { u.dir = -u.dir + (Math.random() > 0.5 ? 0.4 : -0.4); }
      // шаг-подпрыгивание
      crab.position.y = 0.05 + Math.abs(Math.sin(u.t * 4)) * 0.08;
      // ходьба ног (чередование)
      for (const leg of u.legs) {
        const ph = leg.userData.phase;
        leg.rotation.z = (leg.userData.origZ || leg.rotation.z) + Math.sin(u.t * 5 + ph) * (leg.rotation.z > 0 ? 0.15 : -0.15);
        leg.userData.origZ = leg.rotation.z;
      }
    } else {
      crab.position.y = 0.05;
      // шевелит клешнями
      for (let i = 0; i < u.claws.length; i++) {
        const cl = u.claws[i];
        cl.rotation.z = Math.sin(u.t * 3 + i * Math.PI) * 0.35;
        cl.rotation.x = 0.2 + Math.sin(u.t * 2) * 0.15;
      }
    }
  }

  // Улитки
  for (const s of snails) {
    const u = s.userData;
    u.turnTimer -= dt;
    if (u.turnTimer <= 0) { u.dir = Math.random() * 6; u.turnTimer = 3 + Math.random() * 4; }
    if (u.onWall) {
      // ползёт по стеклу
      s.position.y += Math.sin(elapsed * 0.5 + u.dir) * 0.05;
      s.position.y = Math.max(TANK.bottom + 0.2, Math.min(TANK.water - 0.3, s.position.y));
    } else {
      s.position.y = TANK.bottom + 0.15 + Math.sin(elapsed + u.dir) * 0.04;
    }
    const dx = Math.sin(u.dir) * u.speed * dt;
    const dz = Math.cos(u.dir) * u.speed * dt;
    s.position.x += dx;
    s.position.z += dz;
    // разворот у краёв
    if (s.position.x > TANK.x - 0.4) { s.position.x = TANK.x - 0.4; u.dir = Math.PI - u.dir; }
    if (s.position.x < -TANK.x + 0.4) { s.position.x = -TANK.x + 0.4; u.dir = Math.PI - u.dir; }
    if (s.position.z > TANK.z - 0.4) { s.position.z = TANK.z - 0.4; u.dir = -u.dir; }
    if (s.position.z < -TANK.z + 0.4) { s.position.z = -TANK.z + 0.4; u.dir = -u.dir; }
    s.rotation.y = u.dir;
    // качание усиков
    for (let i = 0; i < u.ants.length; i++) {
      u.ants[i].rotation.z = (i === 0 ? -0.4 : 0.4) + Math.sin(elapsed * 2 + i) * 0.25;
    }
    // лёгкое покачивание тела
    s.rotation.z = Math.sin(elapsed * 1.5 + u.dir) * 0.05;
  }

  // пульсация света помпы
  pumpLight.intensity = 4 + Math.sin(t * 3) * 1.2;

  // Включение/выключение света
  keyLight.intensity += ((lightOn ? 2.1 : 0.25) - keyLight.intensity) * 0.1;
  backLight.intensity += ((lightOn ? 12 : 1.5) - backLight.intensity) * 0.1;
  ambient.intensity += ((lightOn ? 0.55 : 0.18) - ambient.intensity) * 0.1;

  updateCamera();
  renderer.render(scene, camera);

  // FPS
  fpsTimer += dt; fpsAccum += dt; fpsCount++;
  if (fpsTimer >= 0.5) { fpsEl.textContent = Math.round(fpsCount / fpsTimer) + ' fps'; fpsTimer = 0; }
}
animate();
</script>
